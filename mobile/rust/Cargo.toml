[package]
name = "librus-mobile-core"
version = "0.1.2"
edition = "2021"
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
html-escape = "0.2"
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
[profile.release]
opt-level = "s"
lto = true
strip = true
